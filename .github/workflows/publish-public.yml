name: Publish Clean Code to Public Repo

on:
  workflow_run:
    workflows: ["Build and Deploy to IONOS via SFTP/FTPS"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish-clean:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete Sensitive Files Directly
        run: |
          # Löscht die geschützten Daten direkt im aktuellen Ordner
          rm -rf .github/
          rm -f scripts/deploy.mjs
          rm -f public/.htaccess
          rm -f DEPLOYMENT.md

      - name: Push to Public Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          # Wir nutzen einfach den aktuellen Standard-Ordner "."
          source-directory: '.'
          destination-github-username: 'OrhanHero'
          destination-repository-name: 'herotax-code'
          user-email: 'orhan.kahraman@iu-study.org'
          target-branch: 'main'
