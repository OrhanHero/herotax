name: Publish Clean Code to Public Repo

on:
  workflow_run:
    workflows: ["Build and Deploy to IONOS via SFTP/FTPS"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish-clean:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Clean Directory
        run: |
          # Wir erstellen einen sauberen Workspace-Ordner ohne sensible Daten
          mkdir ../clean-code
          # Kopiere alle Dateien außer dem geheimen .github-Ordner und den Skripten
          rsync -arv --exclude='.github' --exclude='scripts/deploy.mjs' --exclude='frontend/scripts/deploy.mjs' . ../clean-code/

      - name: Push to Public Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          # Wir pushen nur den absolut sauberen, gefilterten Ordner!
          source-directory: '../clean-code'
          destination-github-username: 'OrhanHero'
          destination-repository-name: 'herotax-code' # Für AIActEU hier 'AIActEU-code' eintragen
          user-email: 'orhan.kahraman@iu-study.org'
          target-branch: 'main'
