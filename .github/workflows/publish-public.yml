name: Publish Clean Code to Public Repo

# Spiegelt den Quellcode aus diesem privaten Repo in das oeffentliche Repo
# OrhanHero/herotax-code — ohne Deployment- und Betriebs-Interna und ohne
# die Historie des privaten Repos.
#
# Wichtig: Das Zielrepo bekommt bewusst NUR den aktuellen Dateistand als
# neuen Commit obendrauf. Die Historie des privaten Repos wird nie
# uebertragen, sonst waeren die entfernten Dateien ueber alte Commits
# weiterhin oeffentlich lesbar.
#
# Was privat bleibt, steht in PRIVATE_PATHS. Eine neue Datei, die zum
# Deployment oder Betrieb gehoert, gehoert dort eingetragen.

on:
  workflow_run:
    workflows: ["Build and Deploy to IONOS via SFTP/FTPS"]
    types: [completed]
    branches: [GoogleAntigravityIDE]
  workflow_dispatch:
    inputs:
      reset_history:
        description: 'Historie des oeffentlichen Repos verwerfen und mit einem einzigen sauberen Commit neu beginnen'
        required: false
        default: false
        type: boolean

# Nur Lesen im eigenen Repo. Der Push ins oeffentliche Repo laeuft ueber
# das PAT in PUBLIC_REPO_TOKEN, nicht ueber GITHUB_TOKEN — der gilt immer
# nur fuer dieses eine Repository.
permissions:
  contents: read

# Zwei parallele Laeufe wuerden sich beim Push gegenseitig abweisen.
concurrency:
  group: publish-public
  cancel-in-progress: false

env:
  PUBLIC_REPO: OrhanHero/herotax-code
  PUBLIC_BRANCH: main

  # Bleibt im Deployment-Repo. Ein Eintrag pro Zeile, Pfad relativ zur
  # Repo-Wurzel; Verzeichnisse wirken samt Inhalt.
  PRIVATE_PATHS: |
    .github
    DEPLOYMENT.md
    README.public.md
    .gitignore.public
    docs/IONOS-CHECKLISTE.md
    docs/SICHERHEIT.md
    public/.htaccess
    scripts/analyze-logs.mjs
    scripts/check-routes.mjs
    scripts/deploy.mjs
    scripts/security-check.mjs

  # npm-Skripte, die auf die eben entfernten Dateien zeigen wuerden.
  PRIVATE_NPM_SCRIPTS: check:routes security:check security:logs deploy:check

  # Abhaengigkeiten, die es nur fuer scripts/deploy.mjs gibt.
  PRIVATE_NPM_DEPS: basic-ftp ssh2-sftp-client

jobs:
  publish-clean:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Token pruefen
        env:
          API_TOKEN_GITHUB: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$API_TOKEN_GITHUB" ]; then
            echo "::error::Secret PUBLIC_REPO_TOKEN fehlt oder ist leer. Ohne dieses Token kann nicht ins oeffentliche Repo gepusht werden (GITHUB_TOKEN gilt nur fuer dieses Repository). Anlegen: Fine-grained PAT mit 'Contents: Read and write' auf ${PUBLIC_REPO}, dann unter Settings > Secrets and variables > Actions als PUBLIC_REPO_TOKEN hinterlegen."
            exit 1
          fi

          # Echte Schreibprobe, bevor der Job Zeit in Checkout und Build
          # steckt und erst in der letzten Zeile am Push scheitert.
          #
          # Lesende Pruefungen taugen dafuer nicht: ${PUBLIC_REPO} ist
          # oeffentlich, also liest es jedes Token — auch eines ohne jede
          # Freigabe. Und 'permissions.push' aus der Repo-API beschreibt die
          # Rolle des Kontos, nicht den Umfang des Tokens; beim Eigentuemer
          # steht dort immer true. Nur ein echter Schreibzugriff ist
          # aussagekraeftig: einen Ref anlegen und sofort wieder loeschen.
          sha=$(git ls-remote "https://github.com/${PUBLIC_REPO}" "refs/heads/${PUBLIC_BRANCH}" | cut -f1)
          probe=refs/heads/token-schreibprobe
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' -X POST \
                   -H "Authorization: Bearer $API_TOKEN_GITHUB" \
                   -H "Accept: application/vnd.github+json" \
                   -d "{\"ref\":\"${probe}\",\"sha\":\"${sha}\"}" \
                   "https://api.github.com/repos/${PUBLIC_REPO}/git/refs" || echo "000")

          if [ "$code" = "201" ]; then
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: Bearer $API_TOKEN_GITHUB" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${PUBLIC_REPO}/git/${probe}" || true
            echo "Schreibprobe bestanden — das Token darf ${PUBLIC_REPO} beschreiben."
          else
            echo "Antwort der GitHub-API (HTTP $code):"
            cat /tmp/probe.json || true
            echo "::error::Das Token kann ${PUBLIC_REPO} nicht beschreiben (HTTP $code). Zu pruefen im Fine-grained PAT: 1. unter 'Repository access' muss ${PUBLIC_REPO} ausgewaehlt sein — Lesen klappt auch ohne, weil das Repo oeffentlich ist; 2. unter 'Repository permissions' muss 'Contents' auf 'Read and write' stehen. Danach das Secret PUBLIC_REPO_TOKEN neu hinterlegen."
            exit 1
          fi

      - name: Privaten Code auschecken
        uses: actions/checkout@v4
        with:
          # Bei workflow_run zeigt github.ref auf den Default-Branch, nicht
          # auf den tatsaechlich deployten Stand — deshalb den head_sha des
          # ausloesenden Laufs verwenden.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 1
          path: private

      - name: Oeffentliches Repo auschecken
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          ref: ${{ env.PUBLIC_BRANCH }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          fetch-depth: 1
          path: public-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sauberen Stand zusammenstellen
        run: |
          set -euo pipefail
          rm -rf clean && mkdir clean
          cp -a private/. clean/
          # Ohne .git — die Historie des privaten Repos bleibt privat.
          rm -rf clean/.git

          # Deployment- und Betriebs-Interna entfernen.
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            rm -rf "clean/$p"
            echo "  entfernt: $p"
          done <<< "$PRIVATE_PATHS"

      - name: Oeffentliche Fassungen von README und .gitignore einsetzen
        run: |
          set -euo pipefail
          # Die private README beschreibt Hoster, Deploy-Pipeline und
          # Betriebs-Skripte. Oeffentlich gilt README.public.md.
          if [ -f private/README.public.md ]; then
            cp private/README.public.md clean/README.md
            echo "README.public.md als README.md uebernommen."
          else
            echo "::error::private/README.public.md fehlt. Ohne diese Datei wuerde die interne README mit Hoster- und Deploy-Details veroeffentlicht."
            exit 1
          fi

          # Die private .gitignore zaehlt die Dateitypen auf, mit denen die
          # Auslieferung an den Hoster arbeitet — das ist Doku des Uploads.
          if [ -f private/.gitignore.public ]; then
            cp private/.gitignore.public clean/.gitignore
            echo ".gitignore.public als .gitignore uebernommen."
          else
            echo "::error::private/.gitignore.public fehlt. Ohne diese Datei wuerde die interne .gitignore mit der Aufzaehlung der Zugangsdaten-Dateitypen veroeffentlicht."
            exit 1
          fi

      - name: package.json von Deployment-Anteilen befreien
        working-directory: clean
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const file = "package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const drop = (obj, keys, label) => {
              for (const k of keys) {
                if (obj && k in obj) {
                  delete obj[k];
                  console.log(`  ${label} entfernt: ${k}`);
                }
              }
            };
            drop(pkg.scripts, process.env.PRIVATE_NPM_SCRIPTS.split(/\s+/).filter(Boolean), "npm-Skript");
            drop(pkg.devDependencies, process.env.PRIVATE_NPM_DEPS.split(/\s+/).filter(Boolean), "devDependency");
            drop(pkg.dependencies, process.env.PRIVATE_NPM_DEPS.split(/\s+/).filter(Boolean), "dependency");
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
          # Lockfile nachziehen, sonst bricht "npm ci" im oeffentlichen Repo
          # mit "package.json and package-lock.json are not in sync" ab.
          # Bestehende Aufloesungen bleiben gepinnt, es fallen nur die
          # entfernten Pakete samt ihrer transitiven Deps heraus.
          npm install --package-lock-only --ignore-scripts

      - name: Sicherheitsnetz — keine Interna im Upload
        run: |
          set -euo pipefail
          fail=0

          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if [ -e "clean/$p" ]; then
              echo "::error::'$p' liegt noch im zu veroeffentlichenden Stand."
              fail=1
            fi
          done <<< "$PRIVATE_PATHS"

          # Schluessel- und Umgebungsdateien, die laut .gitignore nie im
          # Repo landen duerfen — doppelt geprueft, weil ein Fund hier
          # oeffentlich nicht mehr zurueckzuholen waere.
          if find clean -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.ppk' -o -name '.env*' -o -name '.npmrc' -o -name '.netrc' -o -name '.htpasswd' -o -name 'id_rsa' -o -name 'id_ed25519' \) | grep -q .; then
            echo "::error::Schluessel- oder Umgebungsdatei im zu veroeffentlichenden Stand gefunden:"
            find clean -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.ppk' -o -name '.env*' -o -name '.npmrc' -o -name '.netrc' -o -name '.htpasswd' -o -name 'id_rsa' -o -name 'id_ed25519' \)
            fail=1
          fi

          # Kein npm-Skript und keine Deploy-Abhaengigkeit darf uebrig sein.
          for s in $PRIVATE_NPM_SCRIPTS; do
            if node -p "Object.keys(require('./clean/package.json').scripts || {}).includes('$s')" | grep -q true; then
              echo "::error::npm-Skript '$s' steht noch in der oeffentlichen package.json."
              fail=1
            fi
          done
          for d in $PRIVATE_NPM_DEPS; do
            if grep -q "\"$d\"" clean/package.json clean/package-lock.json; then
              echo "::error::Abhaengigkeit '$d' steht noch in der oeffentlichen package.json / package-lock.json."
              fail=1
            fi
          done

          # Kein Wort ueber die Auslieferung an den Hoster im veroeffentlichten
          # Stand — weder in Code noch in Kommentaren oder Konfiguration.
          if grep -rniE 'winscp|sftp|ftps|\.ppk|sftp-config|deploy\.mjs|DEPLOYMENT\.md|htaccess|\.htpasswd' clean --exclude-dir=node_modules; then
            echo "::error::Der zu veroeffentlichende Stand dokumentiert noch den Upload zum Hoster (Treffer oben)."
            fail=1
          fi

          # Verweise auf die interne Sicherheitsanalyse: ihre Massnahmen-IDs
          # (M1, M2, ...) und ihr Datum. Der Begriff 'Sicherheitsanalyse' allein
          # ist erlaubt — er kommt in den redaktionellen Artikeln vor.
          if grep -rniE 'Ma(ss|ß)nahme M[0-9]|\(M[0-9]+\)|Analyse vom? [0-9]{2}\.[0-9]{2}\.[0-9]{4}' clean --exclude-dir=node_modules; then
            echo "::error::Der zu veroeffentlichende Stand verweist noch auf die interne Sicherheitsanalyse (Treffer oben)."
            fail=1
          fi

          # 'IONOS' darf nur dort stehen, wo die Datenschutzerklaerung den
          # Hoster nennen muss — das ist rechtlich gefordert und steht ohnehin
          # oeffentlich auf der Seite.
          ionos_ok='clean/src/components/pages/DatenschutzPage.jsx'
          ionos_hits=$(grep -rli 'ionos' clean --exclude-dir=node_modules | grep -vxF "$ionos_ok" || true)
          if [ -n "$ionos_hits" ]; then
            echo "::error::'IONOS' steht ausserhalb der Datenschutzerklaerung im zu veroeffentlichenden Stand:"
            echo "$ionos_hits"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1

      - name: Gegenprobe — oeffentlicher Stand baut fuer sich allein
        working-directory: clean
        run: |
          set -euo pipefail
          # Beweist, dass im oeffentlichen Repo nichts fehlt, was der Build
          # braucht (z. B. scripts/sitemap.mjs, das vite.config.js importiert).
          npm ci
          npm run lint
          npm run build
          rm -rf node_modules dist

      - name: Dateistand ins oeffentliche Repo uebernehmen
        run: |
          set -euo pipefail
          # Reste der Gegenprobe, falls die je anders abbricht.
          rm -rf clean/node_modules clean/dist
          # Ziel leerraeumen (ausser .git), damit privat entfernte Dateien
          # auch oeffentlich verschwinden. Danach den sauberen Stand kopieren.
          find public-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a clean/. public-repo/

      - name: Commit und Push
        working-directory: public-repo
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RESET_HISTORY: ${{ inputs.reset_history }}
        run: |
          set -euo pipefail
          git config user.name  "herotax publish bot"
          git config user.email "noreply@herotax.de"

          if [ "$RESET_HISTORY" = "true" ]; then
            # Einmal-Aktion: Die bisherige Historie des oeffentlichen Repos
            # wird verworfen. Noetig, wenn dort einmal etwas gelandet ist, das
            # ein spaeterer Commit zwar geloescht hat, 'git log' aber weiterhin
            # zeigt — ein Loeschen im Dateibaum entfernt keine alten Objekte.
            echo "::warning::Historie wird verworfen und durch einen einzelnen Commit ersetzt."
            git checkout --orphan neustart
            git add -A
            git commit -m "Quellcode von herotax.de (Stand ${SOURCE_SHA::7})"
            git push --force origin "HEAD:${PUBLIC_BRANCH}"
            exit 0
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen — nichts zu veroeffentlichen."
            exit 0
          fi
          git commit -m "Sync Quellcode aus dem privaten Repo (${SOURCE_SHA::7})"
          git push origin "HEAD:${PUBLIC_BRANCH}"
