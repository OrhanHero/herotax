name: Build and Deploy to IONOS via SFTP/FTPS

on:
  push:
    branches:
      - main
      - master
      - GoogleAntigravityIDE
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to IONOS (SFTP/FTPS Auto-Connect Engine)
        run: node scripts/deploy.mjs
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
