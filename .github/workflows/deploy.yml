name: Build and Deploy to IONOS via SFTP/FTPS

on:
  push:
    branches:
      - GoogleAntigravityIDE
  schedule:
    # Alle 4 Stunden automatisches Re-Deployment zu IONOS
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = bauen und hochladen · check = nur SFTP-Verbindung und Zielverzeichnis prüfen'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - check

jobs:
  # Reiner Verbindungstest — lädt nichts hoch und löscht nichts.
  # Gedacht nach einem Wechsel der SFTP-Zugangsdaten: Ein neuer Benutzer kann
  # bei IONOS in einem anderen Startverzeichnis landen. Ohne diese Prüfung
  # würde der nächste Deploy still am falschen Ort landen und der
  # Prune-Schritt dort aufräumen.
  check-connection:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: SFTP-Verbindung und Zielverzeichnis prüfen
        run: node scripts/deploy.mjs --check
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}

  build-and-deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          # Volle Historie: der Sitemap-Generator liest lastmod je Seite aus
          # "git log". Ein flacher Checkout kennt nur den letzten Commit und
          # würde alle Seiten auf das heutige Datum setzen.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to IONOS (SFTP/FTPS Auto-Connect Engine)
        run: node scripts/deploy.mjs
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
