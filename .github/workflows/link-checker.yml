name: Automated Link Health Checker

on:
  push:
    branches:
      - GoogleAntigravityIDE
      - main
  schedule:
    # Täglich um 06:00 Uhr UTC (08:00 Uhr Berlin Zeit)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Der Anspruch der Seite ist "jede Meldung mit Primärquelle" — ein toter
      # Behördenlink ist damit ein inhaltlicher Fehler, kein Schönheitsfehler.
      #
      # --accept: 403 und 429 kommen bei Bundes- und Landesportalen regelmäßig
      # vom Bot-Schutz, nicht von einem kaputten Link. Sie gelten deshalb als
      # in Ordnung. 404 und 410 bedeuten dagegen wirklich "weg" — dann schlägt
      # der Lauf fehl und GitHub benachrichtigt.
      #
      # --exclude: zwei Hosts sind für automatisierte Prüfer grundsätzlich
      # nicht erreichbar und würden den Check dauerhaft rot färben, ohne dass
      # inhaltlich etwas kaputt wäre:
      #   handelsregister.de     — bricht die Verbindung für Nicht-Browser ab
      #   gesetze-im-internet.de — antwortet automatisierten Clients nicht
      #                            innerhalb des Timeouts (2 Retries erfolglos)
      # Beide werden im Lauf vom 12.08.2026 als einzige Auffälligkeiten
      # gemeldet, obwohl die Seiten im Browser erreichbar sind. Ändert sich
      # dort etwas, fällt es nur bei manueller Prüfung auf — siehe
      # docs/SICHERHEIT.md, Abschnitt Inhaltsprüfung.
      - name: Verify Official Government Links
        uses: lycheeverse/lychee-action@v2.3.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-redirects 5
            --max-retries 2
            --timeout 20
            --accept 200,206,301,302,303,307,308,403,429
            --exclude-mail
            --exclude '^https?://(www\.)?handelsregister\.de'
            --exclude '^https?://(www\.)?gesetze-im-internet\.de'
            './src/**/*.js'
            './src/**/*.jsx'
            './README.md'
            './DEPLOYMENT.md'
            './docs/**/*.md'
          output: lychee-report.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Läuft auch bei rotem Check, damit der Bericht im Actions-Tab sichtbar
      # ist statt nur im Rohlog.
      - name: Bericht in die Job-Zusammenfassung schreiben
        if: always()
        run: cat lychee-report.md >> "$GITHUB_STEP_SUMMARY" || true
