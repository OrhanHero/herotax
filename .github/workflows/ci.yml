name: Code Quality & Build Check

on:
  push:
    branches:
      - GoogleAntigravityIDE
  pull_request:
    branches:
      - GoogleAntigravityIDE

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          # Volle Historie, damit der Sitemap-Generator im Build-Check
          # dieselben lastmod-Daten ermittelt wie beim Deploy.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Verify Build
        run: npm run build
