name: Code Quality & Build Check

on:
  push:
    branches-ignore:
      - main
      - master
      - GoogleAntigravityIDE
  pull_request:
    branches:
      - main
      - master
      - GoogleAntigravityIDE

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Verify Build
        run: npm run build
